<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Catalog</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Product Catalog</h1>
        <p>Browse our products and make a purchase</p>
      </header>

      <div id="checkoutBanner" class="checkout-banner" hidden></div>
      <script>
        // Show the return banner before app.js loads. Stripe.js init with a
        // missing publishable key can throw and abort the rest of app.js —
        // paid customers still need to see that checkout completed.
        (function showCheckoutReturnBanner() {
          var params = new URLSearchParams(window.location.search);
          var banner = document.getElementById('checkoutBanner');
          if (!banner) {
            return;
          }
          if (params.get('session_id') || params.get('checkout') === 'success') {
            banner.className = 'checkout-banner success';
            banner.textContent = 'Payment successful. Thank you for your purchase.';
            banner.hidden = false;
            return;
          }
          if (params.get('checkout') === 'canceled') {
            banner.className = 'checkout-banner canceled';
            banner.textContent = 'Checkout was canceled. Your cart is unchanged.';
            banner.hidden = false;
          }
        })();
      </script>

      <main>
        <div class="filters">
          <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            class="search-box"
          />
        </div>

        <div id="productsContainer" class="products-grid">
          <div class="loading">Loading products...</div>
        </div>
      </main>

      <aside id="cart" class="cart">
        <h2>Shopping Cart</h2>
        <div id="cartItems" class="cart-items">
          <p class="empty">Your cart is empty</p>
        </div>
        <div class="cart-summary">
          <div class="total">
            <strong>Total:</strong>
            <span id="cartTotal">$0.00</span>
          </div>
          <button id="checkoutBtn" class="checkout-btn" disabled>Checkout</button>
        </div>
      </aside>
    </div>

    <!-- Modal for product details -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
